services:
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    profiles: [tracing]
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./ops/jaeger.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  postgres:
    image: postgres:17-alpine
    container_name: booking-app-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-booking_app}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-booking_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set}
      DB_USERNAME: ${DB_USERNAME:-booking_runtime}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      LIQUIBASE_USERNAME: ${LIQUIBASE_USERNAME:-booking_migrator}
      LIQUIBASE_PASSWORD: ${LIQUIBASE_PASSWORD:?LIQUIBASE_PASSWORD must be set}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/001-provision-roles.sh:/docker-entrypoint-initdb.d/001-provision-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-booking_admin} -d ${POSTGRES_DB:-booking_app}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.8.7
    container_name: booking-app-kafka
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [tools]
    container_name: booking-app-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: booking-app-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    restart: unless-stopped

  booking-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["java", "-Dloader.main=com.bookingapp.infrastructure.migration.DatabaseMigration", "-cp", "/app/app.jar", "org.springframework.boot.loader.launch.PropertiesLauncher"]
    environment:
      LIQUIBASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-booking_app}
      LIQUIBASE_USERNAME: ${LIQUIBASE_USERNAME:-booking_migrator}
      LIQUIBASE_PASSWORD: ${LIQUIBASE_PASSWORD:?LIQUIBASE_PASSWORD must be set}
    restart: "no"

  booking-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-app
    depends_on:
      postgres:
        condition: service_healthy
      booking-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE must be set}
      TRACING_ENDPOINT: ${TRACING_ENDPOINT:-http://jaeger:4318/v1/traces}
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-booking_app}
      DB_USERNAME: ${DB_USERNAME:-booking_runtime}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      SPRING_LIQUIBASE_ENABLED: "false"
      LIQUIBASE_ENABLED: "false"
      LIQUIBASE_PASSWORD: ""
      POSTGRES_ADMIN_PASSWORD: ""
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:8080/payments/success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:8080/payments/cancel/return}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
