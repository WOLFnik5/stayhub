services:
  booking-app:
    environment:
      SPRING_PROFILES_ACTIVE: ${MONITORING_APP_PROFILES:-observability,monitoring}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    secrets:
      - source: metrics_password
        target: app.monitoring.password

  prometheus:
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./ops/monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_password
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--cluster.listen-address="]
    volumes:
      - ./ops/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    secrets:
      - grafana_password
    volumes:
      - ./ops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

secrets:
  metrics_password:
    file: ./ops/monitoring/secrets/metrics-password
  grafana_password:
    file: ./ops/monitoring/secrets/grafana-password

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
