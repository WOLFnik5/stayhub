global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: stayhub
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    basic_auth:
      username: stayhub-scraper
      password_file: /run/secrets/metrics_password
    static_configs:
      - targets: [booking-app:8080]
