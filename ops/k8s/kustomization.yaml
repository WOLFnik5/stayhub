apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stayhub-lab
resources:
  - config.yaml
  - booking.yaml
  - booking-lan.yaml
  - migrate.yaml
  - rollouts/booking-rollout.yaml
  - rollouts/booking-canary-analysis.yaml
  - ../monitoring
images:
  - name: stayhub-booking
    newName: ghcr.io/wolfnik5/stayhub
    digest: sha256:00f4022a6e9e39a4e1da7030cc10c722422c14f77ce8f724856df5141790e695
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: booking
      spec:
        replicas: 0
        template:
          spec:
            terminationGracePeriodSeconds: 60
            containers:
              - name: booking
                imagePullPolicy: IfNotPresent
                env:
                  - name: SPRING_PROFILES_ACTIVE
                    value: monitoring,observability,tracing,rollout-fault
                  - name: TRACING_ENDPOINT
                    value: http://jaeger:4318/v1/traces
                  - name: METRICS_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: monitoring-credentials
                        key: metrics-password
                lifecycle:
                  preStop:
                    exec:
                      command: [sleep, "5"]
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: booking-migrate
        annotations:
          argocd.argoproj.io/hook: PreSync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
      spec:
        ttlSecondsAfterFinished: null
        template:
          spec:
            containers:
              - name: migrate
                imagePullPolicy: IfNotPresent
