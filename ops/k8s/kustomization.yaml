apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stayhub-lab
resources:
  - config.yaml
  - booking.yaml
  - booking-lan.yaml
  - migrate.yaml
images:
  - name: stayhub-booking
    newName: ghcr.io/wolfnik5/stayhub
    digest: sha256:2a943421aca15d010ffe8ea08a65dc93a1ad9c61c26e4c1a5b499330c087aa04
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: booking
      spec:
        template:
          spec:
            containers:
              - name: booking
                imagePullPolicy: IfNotPresent
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: booking-migrate
        annotations:
          argocd.argoproj.io/hook: PreSync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
      spec:
        ttlSecondsAfterFinished: null
        template:
          spec:
            containers:
              - name: migrate
                imagePullPolicy: IfNotPresent
