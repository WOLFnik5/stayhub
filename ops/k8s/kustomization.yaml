apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stayhub-lab
resources:
  - config.yaml
  - booking.yaml
  - booking-lan.yaml
  - migrate.yaml
images:
  - name: stayhub-booking
    newName: ghcr.io/wolfnik5/stayhub
    digest: sha256:aed108e6e0b3c09716a6b66e74e5d45ad607a3b60a533d964118e314b8dadb78
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: booking
      spec:
        template:
          spec:
            terminationGracePeriodSeconds: 60
            containers:
              - name: booking
                imagePullPolicy: IfNotPresent
                lifecycle:
                  preStop:
                    exec:
                      command: [sleep, "5"]
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: booking-migrate
        annotations:
          argocd.argoproj.io/hook: PreSync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
      spec:
        ttlSecondsAfterFinished: null
        template:
          spec:
            containers:
              - name: migrate
                imagePullPolicy: IfNotPresent
