apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stayhub-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WOLFnik5/stayhub.git
    targetRevision: refs/heads/dev2/kubernetes-lab
    path: ops/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: stayhub-lab
  ignoreDifferences:
    - kind: Service
      name: booking-lan
      namespace: stayhub-lab
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
    - kind: Service
      name: booking-preview
      namespace: stayhub-lab
      jsonPointers:
        - /spec/selector/rollouts-pod-template-hash
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
