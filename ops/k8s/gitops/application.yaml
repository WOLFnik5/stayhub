apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stayhub-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WOLFnik5/stayhub.git
    targetRevision: refs/heads/dev2/kubernetes-lab
    path: ops/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: stayhub-lab
  syncPolicy:
    automated:
      selfHeal: true
