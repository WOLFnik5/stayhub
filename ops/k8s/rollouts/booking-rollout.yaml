apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: booking
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineAbort: true
  selector:
    matchLabels:
      app: booking
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking
    scaleDown: never
  strategy:
    canary:
      maxUnavailable: 0
      maxSurge: 1
      steps:
        - setWeight: 50
        - pause:
            duration: 60s
        - analysis:
            templates:
              - templateName: booking-canary-http
            args:
              - name: latest-hash
                valueFrom:
                  podTemplateHashValue: Latest
