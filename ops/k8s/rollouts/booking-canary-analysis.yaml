apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: booking-canary-http
spec:
  args:
    - name: latest-hash
  metrics:
    - name: http-5xx-ratio
      interval: 20s
      count: 3
      failureLimit: 0
      inconclusiveLimit: 0
      successCondition: len(result) == 1 && result[0] <= 0.05
      failureCondition: len(result) == 1 && result[0] > 0.05
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |-
            (
              (sum(increase(http_server_requests_seconds_count{job="stayhub",rollout_hash="{{args.latest-hash}}",uri!~"/actuator.*|/health",status=~"5.."}[1m])) or vector(0))
              / sum(increase(http_server_requests_seconds_count{job="stayhub",rollout_hash="{{args.latest-hash}}",uri!~"/actuator.*|/health"}[1m]))
            ) and (sum(increase(http_server_requests_seconds_count{job="stayhub",rollout_hash="{{args.latest-hash}}",uri!~"/actuator.*|/health"}[1m])) >= 10)
    - name: http-p95-seconds
      interval: 20s
      count: 3
      failureLimit: 0
      inconclusiveLimit: 0
      successCondition: len(result) == 1 && result[0] <= 1
      failureCondition: len(result) == 1 && result[0] > 1
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |-
            histogram_quantile(0.95,
              sum by (le) (rate(http_server_requests_seconds_bucket{job="stayhub",rollout_hash="{{args.latest-hash}}",uri!~"/actuator.*|/health"}[1m]))
            ) and (sum(increase(http_server_requests_seconds_count{job="stayhub",rollout_hash="{{args.latest-hash}}",uri!~"/actuator.*|/health"}[1m])) >= 10)
