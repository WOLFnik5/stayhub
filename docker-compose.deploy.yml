services:
  postgres:
    container_name: !reset null
    ports: !reset []
    mem_limit: 512m
    cpus: 0.5
  kafka:
    container_name: !reset null
    ports: !reset []
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 768m
    cpus: 0.75
  kafka-ui:
    profiles: [tools]
    container_name: !reset null
    ports: !override ["127.0.0.1:8081:8080"]
  booking-migrate:
    build: !reset null
    image: "${STAYHUB_IMAGE:?STAYHUB_IMAGE_is_required}"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m"
    mem_limit: 512m
    cpus: 0.5
  booking-app:
    container_name: !reset null
    build: !reset null
    image: "${STAYHUB_IMAGE:?STAYHUB_IMAGE_is_required}"
    env_file: !override
      - ${STAYHUB_ENV_FILE:?STAYHUB_ENV_FILE must be set}
    ports: !override ["8080:8080"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    mem_limit: 768m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8080/actuator/health"]
      start_period: 60s
      interval: 10s
      timeout: 6s
      retries: 6
    stop_grace_period: 30s
