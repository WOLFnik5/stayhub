services:
  postgres:
    container_name: !reset null
    ports: !reset []
  kafka:
    container_name: !reset null
    ports: !reset []
  kafka-ui:
    profiles: [tools]
    container_name: !reset null
    ports: !override ["127.0.0.1:8081:8080"]
  booking-migrate:
    build: !reset null
    image: ${STAYHUB_IMAGE:?STAYHUB_IMAGE must be an immutable image reference}
  booking-app:
    container_name: !reset null
    build: !reset null
    image: ${STAYHUB_IMAGE:?STAYHUB_IMAGE must be an immutable image reference}
    env_file: !override
      - ${STAYHUB_ENV_FILE:?STAYHUB_ENV_FILE must be set}
    ports: !override ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8080/actuator/health"]
      start_period: 60s
      interval: 10s
      timeout: 6s
      retries: 6
    stop_grace_period: 30s
