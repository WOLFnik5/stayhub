spring:
  application:
    name: booking-app
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:booking_app}
    username: ${DB_USERNAME:booking_user}
    password: ${DB_PASSWORD:booking_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:booking-app}
      auto-offset-reset: earliest

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} [correlationId=%X{correlationId} eventId=%X{eventId} traceId=%X{traceId} spanId=%X{spanId}] %kvp %msg%n'

server:
  port: ${SERVER_PORT:8080}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  outbox:
    publish-fixed-delay-ms: 5000
    recovery-fixed-delay-ms: 60000
    cleanup-cron: "0 0 3 * * *"
    max-attempts: 5
    sent-retention-days: 7
    batch-size: 100
    claim-timeout-minutes: 10

  security:
    auth-rate-limit:
      login-attempts: ${AUTH_RATE_LIMIT_LOGIN_ATTEMPTS:10}
      register-attempts: ${AUTH_RATE_LIMIT_REGISTER_ATTEMPTS:5}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
      max-tracked-clients: ${AUTH_RATE_LIMIT_MAX_CLIENTS:100000}
    jwt:
      secret: ${JWT_SECRET:}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  kafka:
    topics:
      booking-created: ${KAFKA_TOPIC_BOOKING_CREATED:booking.created}
      booking-canceled: ${KAFKA_TOPIC_BOOKING_CANCELED:booking.canceled}
      booking-expired: ${KAFKA_TOPIC_BOOKING_EXPIRED:booking.expired}
      accommodation-created: ${KAFKA_TOPIC_ACCOMMODATION_CREATED:accommodation.created}
      payment-succeeded: ${KAFKA_TOPIC_PAYMENT_SUCCEEDED:payment.succeeded}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_replace_me}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:8080/payments/success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:8080/payments/cancel/return}
    currency: ${STRIPE_CURRENCY:usd}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:replace-with-bot-token}
    chat-id: ${TELEGRAM_CHAT_ID:replace-with-chat-id}
  scheduler:
    booking-expiration:
      cron: ${BOOKING_EXPIRATION_CRON:0 0 1 * * *}
